name: Apply financial integrity hardening

on:
  push:
    branches:
      - fix/financial-integrity-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Apply, verify, and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch fix/financial-integrity-hardening "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 scripts/apply_financial_hardening.py
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
          git checkout -- api/index.js || true
          rm -f .github/workflows/apply-financial-hardening.yml scripts/apply_financial_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce financial integrity and access controls"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/financial-integrity-hardening
