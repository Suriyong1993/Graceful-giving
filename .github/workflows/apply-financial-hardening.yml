name: Apply financial integrity hardening

on:
  push:
    branches:
      - fix/financial-integrity-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch fix/financial-integrity-hardening "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply targeted fixes
        run: cd repo && python3 scripts/apply_financial_hardening.py
      - name: Enable pnpm and install
        run: |
          cd repo
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
      - name: Verify
        run: |
          cd repo
          pnpm check
          pnpm test
          pnpm build
          git checkout -- api/index.js || true
      - name: Commit verified fixes
        run: |
          cd repo
          rm -f .github/workflows/apply-financial-hardening.yml scripts/apply_financial_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce financial integrity and access controls"
          git push origin HEAD:fix/financial-integrity-hardening
