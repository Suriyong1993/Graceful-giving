name: Apply financial integrity hardening

on:
  push:
    branches:
      - fix/financial-integrity-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financial-integrity-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Apply targeted fixes
        run: python3 scripts/apply_financial_hardening.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm check
          pnpm test
          pnpm build
          git checkout -- api/index.js || true
      - name: Commit verified fixes
        run: |
          rm -f .github/workflows/apply-financial-hardening.yml scripts/apply_financial_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce financial integrity and access controls"
          git push origin HEAD:fix/financial-integrity-hardening
